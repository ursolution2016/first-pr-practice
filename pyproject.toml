[project]
name = "stmtcheck"
version = "0.1.0"
description = "Screen bank statements for signs of tampering"
requires-python = ">=3.10"
dependencies = ["pypdf>=5", "pdfplumber>=0.11"]

[project.optional-dependencies]
dev = ["pytest", "reportlab"]

[project.scripts]
stmtcheck = "stmtcheck.cli:main"

[tool.setuptools]
packages = ["stmtcheck"]
