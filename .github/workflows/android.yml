name: Build Android app
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    branches: ["ccr-f8afe636-i5mzbk"]  # remove once this workflow is on the default branch
    paths: ["android/**", "stmtcheck/**", ".github/workflows/android.yml"]
permissions:
  contents: write   # lets a version tag publish the release
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }   # Chaquopy's build-time pip needs a matching Python
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - run: gradle -p android assembleDebug --no-daemon --stacktrace
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk stmtcheck-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: stmtcheck-android-apk
          path: stmtcheck-android.apk
      - name: Make sample statements for the emulator test
        run: |
          pip install -e ".[dev]"
          python android/ci/make_samples.py samples
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the app in an emulator and test it end to end
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash android/ci/smoke.sh stmtcheck-android.apk samples
      - name: Publish the tested APK as a GitHub release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          sha256sum stmtcheck-android.apk | tee stmtcheck-android.apk.sha256
          gh release create "$TAG" stmtcheck-android.apk stmtcheck-android.apk.sha256 \
            --title "Statement Check $TAG (Android)" \
            --notes "Self-contained Android app: the engine and OCR run on the phone and statements are never uploaded. Download stmtcheck-android.apk, allow installing from your browser or Files app, and open it. Debug-signed (sideload only). This exact file passed the on-device emulator tests in CI; it has not been tested on a physical phone. Verify with the .sha256 file."
